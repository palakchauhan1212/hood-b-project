<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finally</title>
    <style>
        body {
            background-color: #10141D;
        }
        h2 {
            font-style: Poppins;
            font-size: 4vw;
            color: #A9A7A2;
            letter-spacing: 20%;
            text-align: center;
            margin-top: 15%;
        }
        h1 {
            color: #F5F1EA;
            font-style: Playfair Display;
            font-size: 7.3vw;
            margin: 9% 14%;
            text-align: center;
            line-height: 1.1;
        }
        .container {
            margin: 0 15vw 10vw 15vw;

        }
        .images {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            width: 50vw;
            aspect-ratio: 1;
        }
        .punchline {
            margin: 5% 12%;

<body>
    <h2>AND FINALLY…</h2>
    <h1>Happy Birthday 🎂</h1>
    <hr><br>
    <div class="container">
        You deserve a day as memorable as the moments you've captured for everyone else
    </div>
    <div class="images">
        <img src="https://i.pinimg.com/originals/cb/fd/54/cbfd54d3c9fd2ed0a600eb6f1db00b2d.gif">
    </div>
    <br>
    <div class="punchline"><b>👉 HAPPY BIRTHDAY CAMERAMAN 👈</b></div>

    </div>
